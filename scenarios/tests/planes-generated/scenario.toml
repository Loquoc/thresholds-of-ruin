# A generated family derived onto the Ethereal Plane: every generated room has
# a shadow in the family's identity block. The run starts by shifting the
# character. Validate after every edit.
format = 38
id = "planes-generated"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
characters = [{ id = 1, anchor = "caves.depths/1/start", turn_ticks = 100 }]

[generation_recipes."caves.rooms"]
kind = "grid_rooms"
version = 1
room_width = [4, 6]
room_height = [3, 5]
extra_connections = [0, 1]

[procedural_worlds."caves.depths"]
kind = "grid_chain"
version = 1
grid = [1, 1]
size = [12, 10, 2]
recipe = "caves.rooms"
domain = { kind = "finite", count = 2 }

[planes.ethereal]
mysterious = "a grey, sourceless mist"
revealed = "the Border Ethereal"
gravity = [0, 0, 0]
movement_modes = [{ mode = "ether_glide", check = { skill = "discipline", dc = 15 } }]
channels = [{ to = "material", range = 12 }]
derive_families = ["caves.depths"]

[scripting]
scripts = ["scripts/start.luau"]

[[scripting.hooks]]
on = "run_started"
handler = "start.shift"
