# The haunted chapel: ghosts on the Ethereal Plane strike the living in the
# nave. A hit may give the victim a glimpse of its attacker; only a magical
# weapon harms a glimpsed ghost. The vestry lies outside the Ethereal overlap.
# Validate after every edit.
format = 38
id = "haunted-chapel"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
themes = ["stone"]
factions = { pilgrims = ["dead"], dead = ["pilgrims"] }
ai_profiles = { tactical = { flee_percent = 0 } }
archetypes = { "cold_iron_dagger" = { identity = "item.weapon.cold-iron-dagger", class = "weapon", name = "cold-iron dagger", magical = true, equipment = { slot = "weapon", attack = { skill = "light_weaponry", bonus = 0, wind_up = 40, recovery = 40, damage = { primary = { category = "keen", sides = 4 }, components = [{ category = "keen", amount = { type = "rolled", count = 1, sides = 4, bonus = 1 } }] } }, modifiers = [] } }, "veil_incense" = { identity = "item.potion.veil-incense", class = "potion", name = "veil incense", consumable = { effects = [{ kind = "plane_shift", plane = "ethereal", returns = "action", duration = 2000 }] } }, "ghost" = { name = "ghost", creature = { corpse_identity = "item.corpse.persona.ghost", species = "ghost", name = "ghost", faction = "dead", binding = "willpower", hit_dice = [{ source = "racial", purchases = [] }], starting_skills = ["light_weaponry", "perception"], restoration = "choose_again", nutrition = { kind = "exempt" } } } }
characters = [{ id = 1, anchor = "1/start", turn_ticks = 100, body = { cells = [[0, 0, 0], [0, 0, 1]], eye = [0, 0, 1], mass = 80 }, creature = { corpse_identity = "item.corpse.persona.pilgrim", species = "human", name = "pilgrim", faction = "pilgrims", binding = "willpower", hit_dice = [{ source = "racial", purchases = [] }], starting_skills = ["light_weaponry", "perception"], restoration = "choose_again", nutrition = { kind = "exempt" } } }]

[creatures.species.human]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "humanoid"
attributes = { strength = 1, speed = 0, intellect = 0, willpower = 1, awareness = 1, presence = 0 }
melee = { skill = "light_weaponry", bonus = 0, wind_up = 40, recovery = 60, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "rolled", dice = { count = 1, sides = 3, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 20 } }]

# Native to the Ethereal Plane; it flies, so it never needs ether-gliding.
[creatures.species.ghost]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "undead"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 2, awareness = 2, presence = 1 }
melee = { skill = "light_weaponry", bonus = 2, wind_up = 60, recovery = 100, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "natural_attack" }, against = { kind = "defense", defense = "spiritual" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "spirit", amount = { kind = "rolled", dice = { count = 1, sides = 3, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "locomotion", value = { kind = "flying", enabled = true } } }, { scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 4 } }]
displacement = { size = "medium", anchored = false }

[planes.ethereal]
mysterious = "a grey, sourceless mist in which walls are only suggestions"
revealed = "the Border Ethereal, which lies against the waking world"
lore_dc = 14
gravity = [0, 0, 0]
movement_modes = [{ mode = "ether_glide", check = { skill = "discipline", dc = 15 } }]
channels = [{ to = "material", range = 12 }]
cross_plane_reach = ["ghost"]
regions = [1002]
overlaps = [{ from = 2, min = [0, 0, 0], max = [7, 2, 1], to = 1002, origin = [0, 0, 0] }]

[scripting]
scripts = ["scripts/haunting.luau"]

[[scripting.hooks]]
on = "region_first_visit"
region = 2
handler = "haunting.cold_air"
once = true

[[scripting.hooks]]
on = "cross_plane_struck"
actors = "creature"
handler = "haunting.struck"

[[scripting.hooks]]
on = "plane_shifted"
handler = "haunting.arrived"
