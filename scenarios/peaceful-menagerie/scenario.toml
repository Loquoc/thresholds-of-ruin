# All catalog mobs share a peaceful, fully lit viewing hall.
format = 38
id = "peaceful-menagerie"
version = "1.0"
ruleset = "rules.toml"
modules = ["catalog/actors.toml", "catalog/bodies.toml", "catalog/creatures.toml", "catalog/items.toml"]
default_character = 1
themes = ["dungeon"]
factions = { delvers = [], dungeon_foes = [] }
ai_profiles = { wander = { care = false, equipment = false, loot = false, flee_percent = 0 } }

[[characters]]
asset = "creature.humanoid.human"
id = 1
anchor = "1/start"
turn_ticks = 100
unselected = "omit"
body = { cells = [[0, 0, 0], [0, 0, 1]], eye = [0, 0, 1], mass = 80 }
known_identities = ["item.weapon.mace", "item.armor.ring-mail", "item.misc.clean-bandage", "item.food.ration", "item.amulet.amulet-of-yendor"]
loadout = []

[characters.creature]
body_package = "rogue.body.human"
species = "rogue.human"
name = "Visitor"
corpse_identity = "item.corpse.persona.warrior"
faction = "delvers"
binding = "intellect"
starting_skills = ["heavy_weaponry", "discipline"]
restoration = "choose_again"
nutrition = { kind = "exempt" }
future_growth = { kind = "selected", source = { kind = "class", class = "warrior" } }
hit_dice = [{ source = "racial", purchases = [] }, { source = "warrior", purchases = [] }]

[assets]
dungeon = ["creature.ape.yeti", "creature.aquator", "creature.bat", "creature.bird.emu", "creature.bird.kestrel", "creature.centaur", "creature.dragon", "creature.elemental.ice", "creature.equine.quagga", "creature.equine.unicorn.black", "creature.fey.leprechaun", "creature.fey.nymph", "creature.goblin.hobgoblin", "creature.griffin", "creature.humanoid.orc", "creature.jabberwock", "creature.medusa", "creature.plant.venus.flytrap", "creature.serpent.rattlesnake", "creature.serpent.snake", "creature.troll", "creature.undead.phantom", "creature.undead.vampire", "creature.undead.wraith", "creature.undead.zombie", "creature.xeroc", "item.amulet", "item.armor", "item.armor.leather", "item.armor.leather.studded", "item.armor.mail", "item.armor.mail.chain", "item.armor.mail.ring", "item.armor.mail.scale", "item.armor.plate", "item.armor.plate.banded", "item.armor.plate.splint", "item.bandage", "item.coin", "item.food", "item.food.fruit", "item.food.ration", "item.potion", "item.potion.amber", "item.potion.azure", "item.potion.cerulean", "item.potion.chartreuse", "item.potion.copper", "item.potion.crimson", "item.potion.indigo", "item.potion.ochre", "item.potion.pearl", "item.potion.saffron", "item.potion.silver", "item.potion.smoky", "item.potion.teal", "item.potion.violet", "item.ring", "item.ring.agate", "item.ring.amethyst", "item.ring.bronze", "item.ring.coral", "item.ring.diamond", "item.ring.emerald", "item.ring.garnet", "item.ring.ivory", "item.ring.jade", "item.ring.opal", "item.ring.quartz", "item.ring.ruby", "item.ring.sapphire", "item.ring.topaz", "item.scroll", "item.scroll.an-dor", "item.scroll.elam-tor", "item.scroll.heth-ara", "item.scroll.iv-mem", "item.scroll.kel-ran", "item.scroll.kha-mer", "item.scroll.lor-nev", "item.scroll.mir-vel", "item.scroll.nar-shen", "item.scroll.nem-al", "item.scroll.or-veth", "item.scroll.os-thal", "item.scroll.sah-ren", "item.scroll.tal-ion", "item.scroll.tir-os", "item.scroll.ur-sek", "item.scroll.vel-mor", "item.scroll.vel-to