# Starter equipment and finite supplies; numerical values are provisional.
namespace = "rogue"

[items."rogue.mace"]
asset = "item.weapon.mace"
name = "mace"
identity = "item.weapon.mace"
class = "weapon"
# The original +1/+1 starter stats are explicit owned birth state.
equipment_generation = { kind = "authored", hit_enchantment = 1, damage_enchantment = 1 }
equipment = { slot = "weapon", attack = { skill = "heavy_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "impact", sides = 4 }, components = [{ category = "impact", amount = { type = "rolled", count = 2, sides = 4, bonus = 0 } }] } }, modifiers = [] }

[items."rogue.ring_mail"]
asset = "item.armor.mail.ring"
name = "ring mail"
identity = "item.armor.ring-mail"
class = "armor"
equipment_generation = { kind = "authored" }
equipment = { slot = "body_armor", armor = { physical_reduction = 2, material = "metal", rustproof = false }, modifiers = [] }

[items."rogue.clean_bandage"]
asset = "item.bandage"
name = "clean bandage"
identity = "item.misc.clean-bandage"
class = "misc"
stackable = true
supply = "bandage"

[items."rogue.ration"]
asset = "item.food.ration"
name = "food ration"
identity = "item.food.ration"
class = "food"
stackable = true
supply = "ration"
edible = { nutrition = { kind = "rolled", dice = { count = 1, sides = 400, bonus = 1099 } } }

# Alternative food in supplemental/treasure stock. The supply tag means
# interchangeable food stock, not ration identity; distinct identities never merge.
[items."rogue.fruit"]
asset = "item.food.fruit"
name = "fruit"
identity = "item.food.fruit"
class = "food"
stackable = true
supply = "ration"
edible = { nutrition = { kind = "rolled", dice = { count = 1, sides = 400, bonus = 1099 } } }

# Bound by the retrieval objective; never ordinary population or starter stock.
[items."rogue.amulet_of_yendor"]
asset = "item.amulet"
name = "Amulet of Yendor"
identity = "item.amulet.amulet-of-yendor"
magical = true
class = "amulet"
stackable = false

# Ordinary restoration removes only the recorded Strength deficit. The fixed
# 1000 operand covers limits::DERIVED_ATTRIBUTE, the canonical deficit bound;
# actual restoration clamps to that deficit. This adds no heal or bonus Strength.
[items."rogue.restore_strength"]
asset = "item.potion"
name = "potion of restore strength"
identity = "item.potion.restore-strength"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "self_effect", effects = [{ kind = "restore_attribute", attribute = "strength", amount = { kind = "fixed", amount = 1000 } }] }

[appearance_pools."rogue.potions"]
appearances = [
  { name = "amber potion", asset = "item.potion.amber" },
  { name = "smoky potion", asset = "item.potion.smoky" },
  { name = "violet potion", asset = "item.potion.violet" },
  { name = "azure potion", asset = "item.potion.azure" },
