# Ordinary recoverable stacks; neither a purse abstraction nor a supply item.
[items."rogue.gold"]
asset = "item.coin"
name = "gold coin"
identity = "item.coin.gold"
class = "coin"
stackable = true
currency = "gold"
magical = false

# Ordinary healing keeps the source's independent level-d4 rolls, sight cure,
# on-use recognition and strict overflow trigger. TOR uses active owned HD and
# improves the earliest eligible acquisition roll by one, bounded by its original
# die maximum. An improved drained row keeps its bonus only on same-row restoration.
[items."rogue.healing"]
asset = "item.potion"
name = "potion of healing"
identity = "item.potion.healing"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "heal_per_hit_die", sides = 4, bonus = 0, overflow = "improve_earliest_hit_die" }, { kind = "remove_condition", condition = "rogue.blindness" }] }

# Extra healing uses independent HDd8 rolls. Strict overflow selects one or two
# earliest eligible owned-HD improvements; the marked visual condition is cured
# unconditionally, including when the drinker cannot see.
[items."rogue.extra_healing"]
asset = "item.potion"
name = "potion of extra healing"
identity = "item.potion.extra-healing"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "heal_per_hit_die", sides = 8, bonus = 0, overflow = "improve_earliest_hit_dice_by_excess" }, { kind = "remove_condition", condition = "rogue.blindness" }, { kind = "remove_condition", condition = "rogue.hallucinating" }] }

# Ordinary timed potion conditions have no gaze-expiry protection. Durations
# preserve source ranges in actor turns; TOR actor-active ticks are an adaptation.
[items."rogue.confusion"]
asset = "item.potion"
name = "potion of confusion"
identity = "item.potion.confusion"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.potion_confusion", duration = { kind = "rolled", dice = { count = 1, sides = 2, bonus = 18 } } }] }

[items."rogue.blindness"]
asset = "item.potion"
name = "potion of blindness"
identity = "item.potion.blindness"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.blindness", duration = { kind = "rolled", dice = { count = 1, sides = 85, bonus = 807 } } }] }

# Delivered poison uses the shared Athletics resistance. Failure loses 1-3
# Strength; the exact consumed unit identifies on use even when resisted.
[items."rogue.poison"]
asset = "item.potion"
name = "potion of poison"
identity = "item.potion.poison"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", descriptors = ["poison"], effects = [{ kind = "lose_attribute", attribute = "strength", amount = { kind = "rolled", dice = { count = 1, sides = 3, bonus = 0 } } }] }

# spread(850) is 808-892 source-base turns. Repeat extends the actor-active
# condition; curing blindness or revealing an invisible actor does not identify.
[items."rogue.see_invisible"]
asset = "item.potion"
name = "potion of see invisible"
identity = "item.potion.see-invisible"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "never", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.see_invisible", duration = { kind = "rolled", dice = { count = 1, sides = 85, bonus = 807 } } }, { kind = "remove_condition", condition = "rogue.blindness" }] }

