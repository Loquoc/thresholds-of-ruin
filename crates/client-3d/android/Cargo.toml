# Experimental Android packaging of the 3D client; see README.md.
# A separate workspace: the Android entry point needs `no_mangle` and a small
# `unsafe` block, which the client crate's `unsafe_code = "forbid"` lint rejects.
[package]
name = "tor-client-3d-android"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
tor-client-3d = { path = ".." }
bevy = { version = "0.16", default-features = false }
libc = "0.2"

# cargo-apk signs only debug builds automatically, so optimize the dev profile.
[profile.dev]
opt-level = 3
debug = 0

[profile.dev.package."*"]
opt-level = 3

[package.metadata.android]
package = "org.example.torprobe"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# The live client reaches its server over a socket, even through USB forwarding.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Thresholds of Ruin (experimental)"

[package.metadata.android.application.activity]
orientation = "landscape"
